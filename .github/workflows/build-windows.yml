name: Build Windows Installer

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # можно запускать вручную кнопкой на GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller `
            uvicorn fastapi pywebview `
            yt-dlp pytubefix "requests[socks]" `
            imageio-ffmpeg playwright `
            anyio httptools websockets watchfiles python-multipart

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Download ffmpeg.exe
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $exe = Get-ChildItem -Recurse ffmpeg_extracted -Filter "ffmpeg.exe" |
                   Where-Object { $_.Directory.Name -eq "bin" } |
                   Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "ffmpeg_bin" | Out-Null
          Copy-Item $exe.FullName "ffmpeg_bin\ffmpeg.exe"
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_extracted

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller main_win.py `
            --name "VOLEAN Downloader" `
            --windowed `
            --noconfirm `
            --collect-all webview `
            --collect-all uvicorn `
            --collect-all playwright `
            --hidden-import app `
            --hidden-import anyio._backends._asyncio `
            --hidden-import fastapi `
            --hidden-import python_multipart `
            --add-data "static;static" `
            --add-data "ffmpeg_bin;ffmpeg_bin"

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          # Inno Setup is pre-installed on windows-latest runners
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOLEAN-Windows-Installer
          path: Output\VOLEAN_Setup.exe
          retention-days: 30
